name: Mihrab
options:
  bundleIdPrefix: com.caferkarakaya.mihrab
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - tr
    - ar
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Debug builds only the host slice. Without this the test action also builds
    # an x86_64 slice, which the Adhan SPM product does not provide, and the
    # link fails.
    ONLY_ACTIVE_ARCH: YES
  configs:
    Debug:
      # DEBUG was never defined anywhere in the project, so every `#if DEBUG`
      # block (debug premium override, CloudKit schema priming) was dead code.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: DEBUG=1 $(inherited)

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift.git
    from: 1.5.0

schemes:
  Mihrab:
    build:
      targets:
        Mihrab: all
        MihrabWidgets: all
    run:
      config: Debug
      language: tr
      region: TR
    test:
      targets:
        - MihrabTests

targets:
  Mihrab:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Mihrab
        excludes:
          - "Resources/Generated/*.png"
    settings:
      base:
        PRODUCT_NAME: Mihrab
        DEFINES_MODULE: YES
        SDKROOT: iphoneos
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MIHRAB_ALARMKIT
        PRODUCT_BUNDLE_IDENTIFIER: com.caferkarakaya.mihrab
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Mihrab uses your location to calculate precise prayer times, Qibla direction, and nearby mosques."
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera is used only to show Qibla direction in AR. Nothing is recorded or uploaded."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mihrab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: YES
        CODE_SIGN_ENTITLEMENTS: Mihrab/Mihrab.entitlements
    info:
      path: Mihrab/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.caferkarakaya.mihrab
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - mihrab
        UIAppFonts:
          - AmiriQuran-Regular.ttf
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.caferkarakaya.mihrab.refresh
          - com.caferkarakaya.mihrab.maintenance
    dependencies:
      - target: MihrabWidgets
        embed: true
      - target: MihrabWatch
        embed: true
      - package: Adhan

  MihrabWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MihrabWidgets
      - path: Mihrab/Core/Shared
      - path: Mihrab/Intents/Shared
      - path: Mihrab/Core/Adhan/MihrabAlarmMetadata.swift
      - path: Mihrab/Core/Subscription/PremiumEntitlement.swift
    resources:
      - path: Mihrab/Resources/Localizable.xcstrings
      - path: MihrabWidgets/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: MihrabWidgets
        SDKROOT: iphoneos
        PRODUCT_BUNDLE_IDENTIFIER: com.caferkarakaya.mihrab.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MIHRAB_ALARMKIT
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MihrabWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: MihrabWidgets/MihrabWidgets.entitlements

  MihrabWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: MihrabWatch
      # Pure Foundation/SwiftUI shared types. PrayerActivityAttributes is
      # excluded: ActivityKit does not exist on watchOS.
      - path: Mihrab/Core/Shared
        excludes:
          - "PrayerActivityAttributes.swift"
      # The watch computes its own times — the calculation code ports as is.
      - path: Mihrab/Data/PrayerEngine.swift
      - path: Mihrab/Data/PrayerSource.swift
      - path: Mihrab/Data/L10n+Times.swift
      - path: Mihrab/Core/Connectivity/WatchBridgePayload.swift
    resources:
      - path: MihrabWatch/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: Mihrab
        PRODUCT_BUNDLE_IDENTIFIER: com.caferkarakaya.mihrab.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MihrabWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: MihrabWatch/MihrabWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: NO
    dependencies:
      - target: MihrabWatchWidgets
        embed: true
      - package: Adhan

  MihrabWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: MihrabWatchWidgets
      - path: MihrabWatch/Shared
      - path: Mihrab/Core/Shared
        excludes:
          - "PrayerActivityAttributes.swift"
      - path: Mihrab/Data/PrayerEngine.swift
      - path: Mihrab/Data/PrayerSource.swift
      - path: Mihrab/Data/L10n+Times.swift
      - path: Mihrab/Core/Connectivity/WatchBridgePayload.swift
    resources:
      - path: MihrabWatchWidgets/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: MihrabWatchWidgets
        SDKROOT: watchos
        PRODUCT_BUNDLE_IDENTIFIER: com.caferkarakaya.mihrab.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MihrabWatchWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: MihrabWatchWidgets/MihrabWatchWidgets.entitlements
    dependencies:
      - package: Adhan

  MihrabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: MihrabTests
      - path: Mihrab/Core/Shared
      - path: Mihrab/Data/BundledContent.swift
      - path: Mihrab/Data/AladhanClient.swift
      - path: Mihrab/Data/PrayerSource.swift
      - path: Mihrab/Data/PrayerEngine.swift
      - path: Mihrab/Data/PrayerCacheStore.swift
      - path: Mihrab/Data/L10n+Times.swift
      - path: Mihrab/Intents/Shared
      - path: Mihrab/Core/Adhan/ReminderPlanner.swift
      - path: Mihrab/Core/Backdrop/DaySegment.swift
      - path: Mihrab/Core/Backdrop/L10n+Backdrop.swift
      - path: Mihrab/Features/Cities/CityTierPolicy.swift
      - path: Mihrab/Core/Sync/CloudSyncPreference.swift
      - path: Mihrab/Core/Sync/KeyValueSync.swift
      - path: Mihrab/Core/Subscription/SubscriptionManager.swift
      - path: Mihrab/Core/Subscription/PremiumEntitlement.swift
      - path: Mihrab/Core/Subscription/TrialReminder.swift
      - path: Mihrab/Features/Paywall/L10n+Paywall.swift
      - path: Mihrab/Features/Zakat/ZakatCalculator.swift
      - path: Mihrab/Features/Zakat/ZakatStore.swift
      - path: Mihrab/Features/Zakat/L10n+Zakat.swift
      - path: Mihrab/Features/Calendar/IslamicObservances.swift
      - path: Mihrab/Features/Calendar/VoluntaryFasts.swift
      - path: Mihrab/Features/Calendar/L10n+Calendar.swift
      - path: Mihrab/Features/Qada/QadaEstimator.swift
      - path: Mihrab/Features/Qada/QadaStore.swift
      - path: Mihrab/Features/Qada/L10n+Qada.swift
      - path: Mihrab/Features/Onboarding/AsrMadhabPreview.swift
      - path: Mihrab/Features/Quran/QuranMetadata.swift
      - path: Mihrab/Features/Quran/QuranText.swift
      - path: Mihrab/Features/Quran/QuranTranslation.swift
      - path: Mihrab/Features/Quran/QuranSearch.swift
      - path: Mihrab/Features/Quran/L10n+Quran.swift
      - path: Mihrab/Features/Hatim/HatimModels.swift
      - path: Mihrab/Features/Hatim/HatimInvite.swift
      - path: Mihrab/Features/Hatim/L10n+Hatim.swift
      - path: Mihrab/Core/Connectivity/WatchBridgePayload.swift
      - path: MihrabWatch/Shared
      - path: Mihrab/Features/Qibla/SolarPosition.swift
      - path: Mihrab/Features/Qibla/QiblaAccuracy.swift
      - path: Mihrab/Features/Times/DevotionalWindows.swift
      - path: Mihrab/Features/Times/L10n+TimesUI.swift
    resources:
      - path: Mihrab/Data/Bundled
    settings:
      base:
        PRODUCT_NAME: MihrabTests
        SDKROOT: iphoneos
        PRODUCT_BUNDLE_IDENTIFIER: com.caferkarakaya.mihrab.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mihrab
      # The test target compiles PrayerEngine.swift into its own module, so it
      # links Adhan itself rather than borrowing the host app's copy.
      - package: Adhan
